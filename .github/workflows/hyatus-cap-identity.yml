name: Hyatus Cap identity

on:
  pull_request:
    paths:
      - ".github/workflows/hyatus-cap-identity.yml"
      - "apps/web/**"
      - "packages/database/**"
      - "packages/web-backend/**"
      - "packages/web-domain/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cap-ci-only
          MYSQL_DATABASE: cap_hyatus_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcap-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:cap-ci-only@127.0.0.1:3306/cap_hyatus_ci
      CAP_HYATUS_TEST_DATABASE_URL: mysql://root:cap-ci-only@127.0.0.1:3306/cap_hyatus_ci
      WEB_URL: https://videos.gptguest.com
      NEXT_PUBLIC_DOCKER_BUILD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run db:push
      - run: bun run --filter=@cap/web test -- __tests__/unit/hyatus-cap-auth.test.ts __tests__/unit/hyatus-browser-auth.test.ts __tests__/unit/hyatus-browser-route.test.ts __tests__/unit/hyatus-desktop-credential.test.ts __tests__/unit/hyatus-extension-credential.test.ts __tests__/unit/hyatus-mobile-credential.test.ts __tests__/unit/videos-policy.test.ts __tests__/unit/public-share-video.test.ts __tests__/unit/public-collections-policy.test.ts __tests__/unit/share-playback.test.ts __tests__/unit/storage-object-route.test.ts __tests__/unit/recording-storage-lifecycle.test.ts __tests__/unit/mobile-api-contract.test.ts __tests__/unit/get-edit-transcript.test.ts __tests__/unit/edit-transcript.test.ts __tests__/unit/video-download-permissions.test.ts __tests__/unit/download-route.test.ts __tests__/integration/hyatus-cap-database.test.ts
